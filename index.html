<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="出題工具" />
<title>栽種澆灌 出題工具</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --water: #38bdf8;
    --seed: #4ade80;
    --male: #60a5fa;
    --female: #f472b6;
    --accent: #f59e0b;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  .screen { flex: 1; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
  .screen.active { display: flex; }

  h1 { font-size: 1.6rem; margin: 0 0 4px; text-align: center; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }

  .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 0.95rem; color: var(--muted); margin-bottom: 8px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }

  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 48px; height: 48px; border-radius: 12px; border: none;
    background: var(--card2); color: var(--text); font-size: 1.6rem; font-weight: 700;
    cursor: pointer;
  }
  .stepper input {
    flex: 1; height: 48px; text-align: center; font-size: 1.4rem; font-weight: 700;
    background: #0b1220; color: var(--text); border: 1px solid var(--card2); border-radius: 12px;
    width: 100%;
  }

  select, input[type=number] {
    width: 100%; height: 48px; font-size: 1.1rem; padding: 0 12px;
    background: #0b1220; color: var(--text); border: 1px solid var(--card2); border-radius: 12px;
  }

  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button {
    flex: 1 1 calc(50% - 4px); height: 48px; border-radius: 12px; border: 1px solid var(--card2);
    background: transparent; color: var(--muted); font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #1a1200; border-color: var(--accent); }

  .btn-primary {
    width: 100%; padding: 18px; border: none; border-radius: 16px;
    background: var(--accent); color: #1a1200; font-size: 1.3rem; font-weight: 800; cursor: pointer;
  }
  .btn-ghost {
    padding: 12px; border: 1px solid var(--card2); border-radius: 12px;
    background: transparent; color: var(--muted); font-size: 1rem; cursor: pointer;
  }

  /* Game screen */
  #game { padding: 0; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; background: var(--card);
  }
  .topbar .qnum { font-size: 1rem; color: var(--muted); font-weight: 600; }
  .timers { display: flex; gap: 18px; align-items: baseline; }
  .timer-total { font-size: 1.3rem; font-weight: 800; }
  .timer-total.warn { color: var(--danger); }
  .timer-q { font-size: 1rem; color: var(--muted); }

  .question-area {
    flex: 0 0 auto; display: flex; flex-direction: row; justify-content: center;
    align-items: stretch; gap: 12px; padding: 12px 16px; text-align: center;
  }
  .qitem {
    flex: 1; min-width: 0; background: var(--card); border-radius: 18px; padding: 12px 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .qitem .icon { font-size: 1.9rem; line-height: 1; }
  .qitem .label { font-size: 1.15rem; font-weight: 700; }
  .qitem .num { display: flex; align-items: baseline; gap: 4px; }
  .qitem.water .count { color: var(--water); }
  .qitem.seed .count { color: var(--seed); }
  .qitem .count { font-size: 2.8rem; font-weight: 900; line-height: 1.05; }
  .qitem .unit { font-size: 1rem; color: var(--muted); }
  .gender { margin-top: 4px; font-size: 1rem; font-weight: 700; }
  .gender .m { color: var(--male); }
  .gender .f { color: var(--female); }

  .controls { padding: 10px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
  .btn-done {
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: var(--seed); color: #052e13; font-size: 1.35rem; font-weight: 900; cursor: pointer;
  }
  .btn-done:active { transform: scale(0.98); }
  .row-2 { display: flex; gap: 12px; }
  .row-2 > * { flex: 1; }
  .controls .btn-ghost { padding: 9px; }

  /* End screen */
  .stat { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--card2); }
  .stat:last-child { border-bottom: none; }
  .stat .k { color: var(--muted); }
  .stat .v { font-weight: 800; font-size: 1.2rem; }
  /* Plant stage (top half) */
  #plantStage {
    position: relative; flex: 1 1 auto; min-height: 50vh; overflow: hidden;
    background: linear-gradient(#12324a, #0d1b2a);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .plant-scene { position: relative; width: 100%; flex: 1; min-height: 0;
    display: flex; align-items: flex-end; justify-content: center; }
  #plantWrap { height: 100%; display: flex; align-items: flex-end;
    transform-origin: 50% 100%;
    transition: clip-path 1.3s ease-out, -webkit-clip-path 1.3s ease-out; }
  #plantWrap.grand { transition: clip-path 2.6s cubic-bezier(.22,1,.36,1), -webkit-clip-path 2.6s cubic-bezier(.22,1,.36,1); }
  #plantWrap svg { height: 100%; width: auto; display: block; }
  .flower { transform-origin: 120px 44px; transition: transform .5s ease; }
  #plantWrap.bloom .flower { animation: bloom 1.2s ease .2s both; }
  @keyframes bloom { 0%{transform:scale(.2) rotate(-40deg)} 70%{transform:scale(1.15) rotate(8deg)} 100%{transform:scale(1) rotate(0)} }

  .watering-can { position: absolute; top: 6%; left: 50%; width: 30%; max-width: 120px;
    transform: translateX(-10%) rotate(0deg); transform-origin: 20% 90%; opacity: .95; }
  .watering-can svg { width: 100%; height: auto; display: block; }
  .plant-scene.pouring .watering-can { animation: tilt 1.1s ease; }
  @keyframes tilt { 0%{transform:translateX(-10%) rotate(0)} 25%{transform:translateX(-10%) rotate(-30deg)}
    70%{transform:translateX(-10%) rotate(-30deg)} 100%{transform:translateX(-10%) rotate(0)} }

  .drops { position: absolute; top: 20%; left: 46%; width: 50px; height: 40%; pointer-events: none; }
  .drops span { position: absolute; top: 0; width: 7px; height: 11px; background: #38bdf8;
    border-radius: 50% 50% 50% 50% / 60% 60% 45% 45%; opacity: 0; }
  .plant-scene.pouring .drops span { animation: drop .75s ease-in forwards; }
  @keyframes drop { 0%{opacity:0; transform:translateY(0) scale(.7)} 15%{opacity:1}
    100%{opacity:0; transform:translateY(90px) scale(1)} }

  .plant-scene.pouring #plantWrap { animation: wobble .9s ease .3s; }
  @keyframes wobble { 0%,100%{transform:rotate(0)} 30%{transform:rotate(1.6deg)} 65%{transform:rotate(-1.6deg)} }

  .plant-caption { padding: 6px 0 8px; font-size: 1rem; color: #bae6fd; font-weight: 700; z-index: 2; }
  .finale-caption { display: none; position: absolute; top: 10px; left: 0; right: 0;
    text-align: center; font-size: 1.05rem; font-weight: 800; color: #fde68a; padding: 0 16px;
    text-shadow: 0 1px 4px rgba(0,0,0,.6); z-index: 3; }

  #game.finale .question-area, #game.finale .controls { display: none; }
  #game.finale #plantStage { flex: 1 1 auto; }
  #game.finale .finale-caption { display: block; }

  .thresh { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .thresh.two { grid-template-columns: 1fr 1fr; }
  .thresh > div { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .thresh .tstar { color: var(--accent); font-size: 0.85rem; letter-spacing: -1px; white-space: nowrap; }
  .thresh input { height: 44px; text-align: center; font-size: 1.1rem; font-weight: 700;
    background: #0b1220; color: var(--text); border: 1px solid var(--card2); border-radius: 10px; width: 100%; }

  .score-card { text-align: center; padding: 24px; }
  .score-label { color: var(--muted); font-size: 1rem; margin-bottom: 6px; }
  .score-stars { font-size: 2.8rem; letter-spacing: 4px; line-height: 1.1; }
  .score-stars .on { color: var(--accent); }
  .score-stars .off { color: var(--card2); }
  .score-num { font-size: 1.4rem; font-weight: 800; margin-top: 8px; }

  .hist { max-height: 40vh; overflow-y: auto; }
  .hist-item { background: var(--card2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 0.95rem; }
  .hist-item .t { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 設定畫面 ===== -->
  <section id="setup" class="screen active">
    <h1>🌱💧 栽種澆灌 出題工具</h1>
    <p class="subtitle">先輸入這一隊的人數，工具會自動出合理的題目</p>

    <div class="card">
      <label>👦 男生人數</label>
      <div class="stepper">
        <button type="button" data-step="male" data-d="-1">−</button>
        <input id="male" type="number" min="0" value="5" inputmode="numeric" />
        <button type="button" data-step="male" data-d="1">＋</button>
      </div>
    </div>

    <div class="card">
      <label>👧 女生人數</label>
      <div class="stepper">
        <button type="button" data-step="female" data-d="-1">−</button>
        <input id="female" type="number" min="0" value="5" inputmode="numeric" />
        <button type="button" data-step="female" data-d="1">＋</button>
      </div>
    </div>

    <div class="card">
      <label>難度</label>
      <div class="seg" id="difficulty">
        <button type="button" data-v="progressive" class="on">漸進（後段加性別）</button>
        <button type="button" data-v="basic">只出數量</button>
        <button type="button" data-v="advanced">全程含性別</button>
        <button type="button" data-v="mixed">隨機混合</button>
      </div>
    </div>

    <div class="card">
      <label>植物成長模式（上半部動畫）</label>
      <div class="seg" id="growthMode">
        <button type="button" data-v="instant" class="on">① 即時成長（答對就長）</button>
        <button type="button" data-v="end">② 神使之成長（結束才長）</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label>總時間（分鐘，0＝不限）</label>
          <input id="totalMin" type="number" min="0" value="3" inputmode="numeric" />
        </div>
        <div>
          <label>幾分後加性別（漸進用）</label>
          <input id="genderAfterMin" type="number" min="0" step="0.5" value="1.5" inputmode="decimal" />
        </div>
      </div>
      <div style="margin-top:12px">
        <label>單項最多幾個（0＝依總人數）</label>
        <input id="maxCount" type="number" min="0" value="0" inputmode="numeric" />
      </div>
    </div>

    <div class="card">
      <label>評分門檻（純娛樂：最低 3★，達完成題數升級）</label>
      <div class="thresh two">
        <div><span class="tstar">★★★★ 需完成</span><input id="t4" type="number" min="0" value="14" inputmode="numeric" /></div>
        <div><span class="tstar">★★★★★ 需完成</span><input id="t5" type="number" min="0" value="18" inputmode="numeric" /></div>
      </div>
    </div>

    <button id="startBtn" class="btn-primary">開始出題</button>
  </section>

  <!-- ===== 遊戲畫面 ===== -->
  <section id="game" class="screen">
    <div class="topbar">
      <span class="qnum">第 <span id="qNum">1</span> 題</span>
      <div class="timers">
        <span class="timer-q">本題 <span id="qTime">0</span> 秒</span>
        <span class="timer-total" id="totalTime">--:--</span>
      </div>
    </div>

    <div id="plantStage">
      <div class="plant-scene">
        <div id="plantWrap">
          <svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <path id="leaf" d="M0,0 C14,-15 36,-13 48,0 C36,13 14,15 0,0 Z" fill="#4ade80"/>
            </defs>
            <!-- 花 (最上，最後才顯露) -->
            <g class="flower">
              <ellipse cx="120" cy="26" rx="9" ry="15" fill="#f472b6" transform="rotate(0 120 44)"/>
              <ellipse cx="120" cy="26" rx="9" ry="15" fill="#f472b6" transform="rotate(60 120 44)"/>
              <ellipse cx="120" cy="26" rx="9" ry="15" fill="#f472b6" transform="rotate(120 120 44)"/>
              <ellipse cx="120" cy="26" rx="9" ry="15" fill="#f472b6" transform="rotate(180 120 44)"/>
              <ellipse cx="120" cy="26" rx="9" ry="15" fill="#f472b6" transform="rotate(240 120 44)"/>
              <ellipse cx="120" cy="26" rx="9" ry="15" fill="#f472b6" transform="rotate(300 120 44)"/>
              <circle cx="120" cy="44" r="11" fill="#fbbf24"/>
              <circle cx="120" cy="44" r="5.5" fill="#f59e0b"/>
            </g>
            <!-- 莖 -->
            <path d="M120,250 C112,205 132,178 120,138 C110,108 126,84 120,56"
                  fill="none" stroke="#3f9d4f" stroke-width="7" stroke-linecap="round"/>
            <!-- 大葉 -->
            <use href="#leaf" transform="translate(120,180) rotate(-18) scale(1.05)"/>
            <use href="#leaf" transform="translate(120,138) rotate(200) scale(1.05)"/>
            <use href="#leaf" transform="translate(120,100) rotate(-22) scale(0.95)"/>
            <use href="#leaf" transform="translate(120,74) rotate(196) scale(0.9)"/>
            <!-- 幼苗子葉 (最底，一直可見) -->
            <use href="#leaf" transform="translate(120,214) rotate(-40) scale(0.5)"/>
            <use href="#leaf" transform="translate(120,214) rotate(220) scale(0.5)"/>
            <!-- 土 -->
            <ellipse cx="120" cy="250" rx="48" ry="7" fill="#5b3a25"/>
            <!-- 盆 -->
            <path d="M74,258 L166,258 L157,298 L83,298 Z" fill="#c9683d"/>
            <rect x="66" y="242" width="108" height="17" rx="6" fill="#b0562f"/>
          </svg>
        </div>
        <div class="watering-can" id="wateringCan">
          <svg viewBox="0 0 90 70" xmlns="http://www.w3.org/2000/svg">
            <path d="M20,28 L18,58 Q18,64 24,64 L52,64 Q58,64 58,58 L56,28 Z" fill="#7dd3fc"/>
            <rect x="16" y="22" width="44" height="9" rx="4" fill="#38bdf8"/>
            <path d="M56,34 L84,14 L86,20 L60,42 Z" fill="#38bdf8"/>
            <path d="M26,24 Q38,4 54,20" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="drops" id="drops">
          <span style="left:2px;  animation-delay:0s"></span>
          <span style="left:12px; animation-delay:.12s"></span>
          <span style="left:22px; animation-delay:.06s"></span>
          <span style="left:32px; animation-delay:.18s"></span>
          <span style="left:42px; animation-delay:.10s"></span>
        </div>
      </div>
      <div class="plant-caption">💧 <span id="waterCount">0</span> 次澆灌</div>
      <div class="finale-caption" id="finaleCaption">🙏 我栽種了，亞波羅澆灌了，惟有神叫它生長</div>
    </div>

    <div class="question-area" id="questionArea"></div>

    <div class="controls">
      <button id="doneBtn" class="btn-done">完成 ✓ 下一題</button>
      <div class="row-2">
        <button id="skipBtn" class="btn-ghost">跳過此題</button>
        <button id="endBtn" class="btn-ghost">結束遊戲</button>
      </div>
    </div>
  </section>

  <!-- ===== 結算畫面 ===== -->
  <section id="end" class="screen">
    <h1>🏁 遊戲結束</h1>
    <div class="card score-card">
      <div class="score-label">評分</div>
      <div class="score-stars" id="rStars">★★★★★</div>
      <div class="score-num"><span id="rScore">0</span> / 5 分</div>
    </div>
    <div class="card">
      <div class="stat"><span class="k">完成題數</span><span class="v" id="rDone">0</span></div>
      <div class="stat"><span class="k">總花費時間</span><span class="v" id="rTotal">0 秒</span></div>
      <div class="stat"><span class="k">每題平均</span><span class="v" id="rAvg">0 秒</span></div>
      <div class="stat"><span class="k">最快 / 最慢</span><span class="v" id="rMinMax">-</span></div>
    </div>
    <div class="card">
      <label>作答紀錄</label>
      <div class="hist" id="hist"></div>
    </div>
    <button id="againBtn" class="btn-primary">再玩一次</button>
    <button id="backBtn" class="btn-ghost" style="margin-top:12px">修改設定</button>
  </section>

</div>

<script>
(function () {
  "use strict";

  // ---------- 小工具 ----------
  var $ = function (id) { return document.getElementById(id); };
  var randInt = function (min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };

  function showScreen(id) {
    var s = document.querySelectorAll(".screen");
    for (var i = 0; i < s.length; i++) s[i].classList.remove("active");
    $(id).classList.add("active");
  }

  function clampInputs() {
    ["male", "female", "totalMin", "maxCount", "t4", "t5"].forEach(function (id) {
      var el = $(id);
      var v = parseInt(el.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      el.value = v;
    });
  }

  // ---------- 狀態 ----------
  var state = null;
  var difficulty = "progressive";
  var growthMode = "instant";

  // ---------- 植物成長 / 澆水 ----------
  var BASE_REVEAL = 0.33; // 最底(盆+幼苗)一直可見的比例
  var wateringTimer = null;

  function growthValue() {
    // 依答對題數 / 5★門檻 換算 0~1 的成長度
    var target = Math.max(1, state.thresholds.t5 || 1);
    return Math.min(state.correct / target, 1);
  }

  function setGrowth(gv, grand) {
    var wrap = $("plantWrap");
    wrap.classList.toggle("grand", !!grand);
    var r = BASE_REVEAL + gv * (1 - BASE_REVEAL);
    var val = "inset(" + ((1 - r) * 100).toFixed(1) + "% 0 0 0)";
    wrap.style.webkitClipPath = val;
    wrap.style.clipPath = val;
    wrap.classList.toggle("bloom", gv >= 0.999);
  }

  function resetPlant() {
    var wrap = $("plantWrap");
    wrap.classList.remove("bloom", "grand");
    $("waterCount").textContent = "0";
    // 不用過場動畫直接回到幼苗
    wrap.style.transition = "none";
    setGrowth(0, false);
    // 強制重繪後恢復過場
    void wrap.offsetWidth;
    wrap.style.transition = "";
  }

  function playWatering() {
    var scene = document.querySelector(".plant-scene");
    scene.classList.remove("pouring");
    void scene.offsetWidth; // 重啟動畫
    scene.classList.add("pouring");
    if (wateringTimer) clearTimeout(wateringTimer);
    wateringTimer = setTimeout(function () {
      scene.classList.remove("pouring");
    }, 1200);
  }
  var totalTimerId = null;
  var qTimerId = null;

  // ---------- 出題邏輯 ----------
  // males / females: 這隊實際人數；cap: 單項最大數量
  // 回傳 { water: {n, gender}, seed: {n, gender} }，其中 gender 可能為 null
  function genQuestion(males, females, cap, useGender) {
    var total = males + females;

    // 決定哪幾種道具出現（至少一種），偏向兩種都出
    var incW, incS;
    var r = Math.random();
    if (r < 0.7) { incW = true; incS = true; }
    else if (r < 0.85) { incW = true; incS = false; }
    else { incW = false; incS = true; }

    function makeItem(include) {
      if (!include) return null;
      var n = randInt(1, Math.max(1, cap));
      var gender = null;
      // 進階：有機會加上性別條件
      if (useGender && Math.random() < 0.65) {
        gender = makeGender(n, males, females);
      }
      return { n: n, gender: gender };
    }

    var q = { water: makeItem(incW), seed: makeItem(incS) };
    // 保底：至少一項
    if (!q.water && !q.seed) {
      q.water = { n: randInt(1, Math.max(1, cap)), gender: null };
    }
    return q;
  }

  // 產生合理的性別條件（絕不超過實際男/女人數）
  // 樣式：full=男X女Y、male=其中X個男生、female=其中X個女生
  function makeGender(n, males, females) {
    var styles = [];
    if (males > 0) styles.push("male");
    if (females > 0) styles.push("female");
    if (males > 0 && females > 0) styles.push("full");
    if (styles.length === 0) return null;

    var style = pick(styles);

    if (style === "male") {
      var maxM = Math.min(n, males);
      return { type: "male", m: randInt(1, maxM) };
    }
    if (style === "female") {
      var maxF = Math.min(n, females);
      return { type: "female", f: randInt(1, maxF) };
    }
    // full：男 m + 女 f = n，且 m<=males, f<=females
    var loM = Math.max(0, n - females);
    var hiM = Math.min(n, males);
    var m = randInt(loM, hiM);
    return { type: "full", m: m, f: n - m };
  }

  function genderText(g) {
    if (!g) return "";
    if (g.type === "male") return '其中 <span class="m">' + g.m + '</span> 個男生';
    if (g.type === "female") return '其中 <span class="f">' + g.f + '</span> 個女生';
    return '男 <span class="m">' + g.m + '</span>、女 <span class="f">' + g.f + '</span>';
  }

  function genderPlain(g) {
    if (!g) return "";
    if (g.type === "male") return "其中 " + g.m + " 個男生";
    if (g.type === "female") return "其中 " + g.f + " 個女生";
    return "男 " + g.m + "、女 " + g.f;
  }

  // ---------- 顯示題目 ----------
  function itemHtml(cls, icon, label, item) {
    var g = item.gender ? '<div class="gender">' + genderText(item.gender) + '</div>' : '';
    return '<div class="qitem ' + cls + '">' +
      '<span class="icon">' + icon + '</span>' +
      '<span class="label">' + label + '</span>' +
      '<div class="num"><span class="count">' + item.n + '</span><span class="unit">個</span></div>' +
      g +
      '</div>';
  }

  function renderQuestion(q) {
    var html = "";
    if (q.seed) html += itemHtml("seed", "🌱", "栽種", q.seed);
    if (q.water) html += itemHtml("water", "💧", "澆灌", q.water);
    $("questionArea").innerHTML = html;
  }

  function questionPlain(q) {
    var parts = [];
    if (q.seed) {
      var s = "栽種 " + q.seed.n + " 個";
      if (q.seed.gender) s += "（" + genderPlain(q.seed.gender) + "）";
      parts.push(s);
    }
    if (q.water) {
      var w = "澆灌 " + q.water.n + " 個";
      if (q.water.gender) w += "（" + genderPlain(q.water.gender) + "）";
      parts.push(w);
    }
    return parts.join("，");
  }

  // ---------- 計時 ----------
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function startTimers() {
    // 總時間倒數
    if (state.totalSec > 0) {
      $("totalTime").textContent = fmt(state.remain);
      totalTimerId = setInterval(function () {
        state.remain--;
        if (state.remain <= 10) $("totalTime").classList.add("warn");
        if (state.remain <= 0) {
          $("totalTime").textContent = "00:00";
          endGame();
          return;
        }
        $("totalTime").textContent = fmt(state.remain);
      }, 1000);
    } else {
      $("totalTime").textContent = "∞";
    }
    // 本題正計時
    qTimerId = setInterval(function () {
      state.qElapsed++;
      $("qTime").textContent = state.qElapsed;
    }, 1000);
  }

  function stopTimers() {
    if (totalTimerId) { clearInterval(totalTimerId); totalTimerId = null; }
    if (qTimerId) { clearInterval(qTimerId); qTimerId = null; }
  }

  // ---------- 流程 ----------
  function nextQuestion(prevOutcome) {
    // 記錄上一題
    if (state.current) {
      state.history.push({
        text: questionPlain(state.current),
        sec: state.qElapsed,
        outcome: prevOutcome
      });
    }
    // 出新題
    var q = genQuestion(state.males, state.females, state.cap, state.useGender());
    state.current = q;
    state.qNum++;
    state.qElapsed = 0;
    $("qNum").textContent = state.qNum;
    $("qTime").textContent = "0";
    renderQuestion(q);
  }

  function startGame() {
    clampInputs();
    var males = parseInt($("male").value, 10) || 0;
    var females = parseInt($("female").value, 10) || 0;
    var total = males + females;
    if (total < 1) { alert("請至少輸入 1 個人"); return; }

    var totalMin = parseInt($("totalMin").value, 10) || 0;
    var maxCount = parseInt($("maxCount").value, 10) || 0;
    var cap = maxCount > 0 ? Math.min(maxCount, total) : total;

    var thresholds = {
      t4: parseInt($("t4").value, 10) || 0,
      t5: parseInt($("t5").value, 10) || 0
    };

    var genderAfterMin = parseFloat($("genderAfterMin").value);
    if (isNaN(genderAfterMin) || genderAfterMin < 0) genderAfterMin = 0;

    state = {
      males: males, females: females, total: total, cap: cap,
      difficulty: difficulty, thresholds: thresholds,
      growthMode: growthMode,
      genderAfterSec: genderAfterMin * 60,
      totalSec: totalMin * 60,
      remain: totalMin * 60,
      startTime: Date.now(),
      qNum: 0, qElapsed: 0, current: null, history: [], correct: 0,
      useGender: function () {
        if (this.difficulty === "basic") return false;
        if (this.difficulty === "advanced") return true;
        if (this.difficulty === "progressive") {
          return (Date.now() - this.startTime) / 1000 >= this.genderAfterSec;
        }
        return Math.random() < 0.6; // mixed
      }
    };

    $("totalTime").classList.remove("warn");
    $("game").classList.remove("finale");
    resetPlant();
    showScreen("game");
    nextQuestion(null);
    startTimers();
  }

  function endGame() {
    stopTimers();
    // 把當前正在作答的題目也算進去（視為完成）
    if (state.current) {
      state.history.push({
        text: questionPlain(state.current),
        sec: state.qElapsed,
        outcome: "done"
      });
      state.current = null;
    }

    var done = state.history.filter(function (h) { return h.outcome !== "skip"; });
    var totalSpent = state.history.reduce(function (a, h) { return a + h.sec; }, 0);
    var times = done.map(function (h) { return h.sec; });

    // 依完成題數計算 1-5 分
    var count = done.length;
    var t = state.thresholds;
    var score;
    if (count >= t.t5) score = 5;
    else if (count >= t.t4) score = 4;
    else score = 3; // 純娛樂教學：最低給 3★
    var starsHtml = "";
    for (var s = 1; s <= 5; s++) {
      starsHtml += '<span class="' + (s <= score ? "on" : "off") + '">★</span>';
    }
    $("rStars").innerHTML = starsHtml;
    $("rScore").textContent = score;

    $("rDone").textContent = done.length + " 題";
    $("rTotal").textContent = totalSpent + " 秒";
    $("rAvg").textContent = done.length ? Math.round(totalSpent / done.length) + " 秒" : "0 秒";
    if (times.length) {
      $("rMinMax").textContent = Math.min.apply(null, times) + " / " + Math.max.apply(null, times) + " 秒";
    } else {
      $("rMinMax").textContent = "-";
    }

    var histHtml = "";
    state.history.forEach(function (h, i) {
      var tag = h.outcome === "skip" ? "（跳過）" : "";
      histHtml += '<div class="hist-item"><span class="t">' + (i + 1) + '.</span> ' +
        h.text + ' <span style="color:var(--muted)">— ' + h.sec + ' 秒 ' + tag + '</span></div>';
    });
    $("hist").innerHTML = histHtml || '<div class="hist-item">沒有作答紀錄</div>';

    var target = Math.max(1, state.thresholds.t5 || 1);
    var finalGv = Math.min(count / target, 1);

    if (state.growthMode === "end") {
      // 神使之成長：留在遊戲畫面，讓植物一次長大，再進結算
      $("game").classList.add("finale");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { setGrowth(finalGv, true); });
      });
      setTimeout(function () {
        $("game").classList.remove("finale");
        showScreen("end");
      }, 3200);
    } else {
      setGrowth(finalGv, false); // 補足最後一題的成長
      showScreen("end");
    }
  }

  // ---------- 事件綁定 ----------
  document.querySelectorAll("[data-step]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var el = $(btn.dataset.step);
      var v = (parseInt(el.value, 10) || 0) + parseInt(btn.dataset.d, 10);
      if (v < 0) v = 0;
      el.value = v;
    });
  });

  document.querySelectorAll("#difficulty button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#difficulty button").forEach(function (b) { b.classList.remove("on"); });
      btn.classList.add("on");
      difficulty = btn.dataset.v;
    });
  });

  document.querySelectorAll("#growthMode button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#growthMode button").forEach(function (b) { b.classList.remove("on"); });
      btn.classList.add("on");
      growthMode = btn.dataset.v;
    });
  });

  $("startBtn").addEventListener("click", startGame);

  $("doneBtn").addEventListener("click", function () {
    // 完成本題 = 答對 → 澆水（即時模式同時成長）
    state.correct++;
    $("waterCount").textContent = state.correct;
    playWatering();
    if (state.growthMode === "instant") setGrowth(growthValue(), false);
    // 記錄並切換到下一題（本題計時重置）
    nextQuestion("done");
  });

  $("skipBtn").addEventListener("click", function () {
    nextQuestion("skip");
  });

  $("endBtn").addEventListener("click", function () {
    if (confirm("確定要結束遊戲？")) endGame();
  });

  $("againBtn").addEventListener("click", startGame);
  $("backBtn").addEventListener("click", function () { showScreen("setup"); });

})();
</script>
</body>
</html>
